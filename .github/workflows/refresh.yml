name: Refresh HerFixtures feeds
on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests icalendar pytz
      - name: ESPN connectivity probe
        run: |
          python3 -c "
          import requests, sys
          try:
              r = requests.get('https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/scoreboard', timeout=10)
              events = len(r.json().get('events', []))
              print(f'ESPN probe: HTTP {r.status_code}, {events} events returned')
              if r.status_code != 200:
                  print('WARNING: ESPN returning non-200 — fetch scripts will skip writes and preserve existing files')
          except Exception as e:
              print(f'ESPN probe: connection error — {e}')
          "
      - name: Run fetch script
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python fetch_fixtures.py
      - name: Run WNBA fetch script
        run: python fetch_wnba.py
      - name: Run WNBA team feeds script
        run: python fetch_wnba_teams.py
      - name: Run NWSL fetch script
        run: python fetch_nwsl.py
      - name: Run NWSL team feeds script
        run: python fetch_nwsl_teams.py
      - name: Run ICC Women's T20 fetch script
        run: python fetch_icc_womens_t20.py
      - name: Run ICC Women's T20 team feeds script
        run: python fetch_icc_womens_t20_teams.py
      - name: Run UCL Women fetch script
        run: python fetch_ucl.py
      - name: Run Liga F fetch script
        run: python fetch_liga_f.py
      - name: Run Liga F team feeds script
        run: python fetch_liga_f_teams.py
      - name: Run Frauen-Bundesliga fetch script
        run: python fetch_frauen_bundesliga.py
      - name: Run Frauen-Bundesliga team feeds script
        run: python fetch_frauen_bundesliga_teams.py
      - name: Generate FIBA Women's World Cup 2026 feed
        run: python generate_fiba_ics.py
      - name: Generate scores.json for strip
        run: python fetch_scores_json.py
      - name: Generate sitemap
        run: python generate_sitemap.py
      - name: Commit and push updated feeds
        run: |
          git config user.name "HerFixtures Bot"
          git config user.email "bot@herfixtures.com"
          git add womens_ucl.ics euroleague_women.ics wnba.ics wnba_*.ics nwsl.ics nwsl_*.ics icc_womens_t20.ics icc_womens_t20_*.ics liga_f.ics liga_f_*.ics frauen_bundesliga.ics frauen_bl_*.ics feeds/fiba-wwc-2026/all.ics scores.json sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-refresh feeds"
          git push
